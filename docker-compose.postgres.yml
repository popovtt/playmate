services:
  postgres_db:
    container_name: playmate_db
    image: postgres:18
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - main
    environment:
      POSTGRES_DB: playmate
      POSTGRES_USER: user_local
      POSTGRES_PASSWORD: password_local

volumes:
  postgres_data:

networks:
  main:
    driver: bridge